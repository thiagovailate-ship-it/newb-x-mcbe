name: AETHER Deep Ocean - iOS shader build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Cache compiler data
        uses: actions/cache@v6
        with:
          key: env-files-linux-laz
          path: |
            ${{ github.workspace }}/tool/data

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare compiler
        run: ./build.sh setup

      - name: Compile iOS shader pack
        run: ./build.sh pack -p ios

      - name: List build outputs
        run: find build -maxdepth 4 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-ios-build
          path: build/
          if-no-files-found: error
          retention-days: 7
