name: build-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  multiplatform:
    runs-on: windows-2022
    steps:
    # NOTE: files/dirs with trailing dots or spaces (e.g. 'aether-build.yml.')
    # break checkout on Windows runners - never commit such names.
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-win-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: |
        .\\build.bat setup
        .\\build.bat pack -p multiplatform -v 99 --no-zip
    # compile materials for Android too - catches GLSL ES specific shader errors
    - run: .\\build.bat mats -p android
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-multiplatform-pr
        # build outputs to build/pack-<profile>; the old '-pr' path never existed
        path: ./build/pack-multiplatform
        if-no-files-found: error
